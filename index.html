<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Byte Casino</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#0a0612;
  --bg2:#12081f;
  --card:#1a0e2e;
  --card2:#231240;
  --neon:#ff2bd6;
  --neon2:#00f0ff;
  --neon3:#b026ff;
  --green:#00ff9d;
  --red:#ff2e63;
  --text:#e8d9ff;
  --muted:#8b7ba8;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at top,#1a0a2e 0%,#0a0612 60%);
  color:var(--text);padding:12px;padding-bottom:90px;min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,43,214,.15),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,240,255,.12),transparent 40%);
}
.wrap{position:relative;z-index:1}

/* HEADER BALANCE */
.bal{
  background:linear-gradient(135deg,rgba(255,43,214,.15),rgba(0,240,255,.08));
  border:1px solid rgba(255,43,214,.4);
  border-radius:16px;padding:16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 0 20px rgba(255,43,214,.3),inset 0 0 20px rgba(255,43,214,.05);
  position:relative;overflow:hidden;
}
.bal::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(255,43,214,.1),transparent 30%);
  animation:spin 8s linear infinite;pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.bal>div{position:relative;z-index:1}
.bal b{font-size:26px;color:var(--neon);text-shadow:0 0 10px rgba(255,43,214,.8),0 0 20px rgba(255,43,214,.4);font-family:'Courier New',monospace}
.bal small{color:var(--neon2);font-size:12px;display:block;margin-top:2px;text-shadow:0 0 6px rgba(0,240,255,.6)}

/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:rgba(35,18,64,.6);border:1px solid rgba(176,38,255,.3);
  color:var(--muted);padding:9px 16px;border-radius:10px;font-size:13px;
  white-space:nowrap;cursor:pointer;transition:.25s;font-weight:600;
  backdrop-filter:blur(10px);
}
.tab.on{
  background:linear-gradient(135deg,rgba(255,43,214,.4),rgba(176,38,255,.3));
  color:#fff;border-color:var(--neon);
  box-shadow:0 0 12px rgba(255,43,214,.6),0 0 24px rgba(255,43,214,.3);
  text-shadow:0 0 8px rgba(255,43,214,.8);
}
.tab:active{transform:scale(.95)}

/* PANELS */
.panel{display:none;animation:fadeIn .3s ease}
.panel.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{
  background:linear-gradient(135deg,rgba(26,14,46,.9),rgba(35,18,64,.8));
  border:1px solid rgba(176,38,255,.3);border-radius:18px;
  padding:20px;margin-bottom:14px;position:relative;overflow:hidden;
  backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(176,38,255,.15),inset 0 1px 0 rgba(255,255,255,.05);
}

/* INPUTS */
input,select{
  width:100%;padding:14px;background:rgba(10,6,18,.8);
  border:1px solid rgba(176,38,255,.4);color:#fff;border-radius:12px;
  font-size:16px;margin-bottom:12px;font-family:inherit;
  transition:.25s;outline:none;
}
input:focus,select:focus{
  border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,43,214,.2),0 0 15px rgba(255,43,214,.4);
}
input::placeholder{color:var(--muted)}

/* BUTTONS */
button.act{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--neon),var(--neon3));
  color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;position:relative;overflow:hidden;
  text-transform:uppercase;letter-spacing:1px;
  box-shadow:0 0 20px rgba(255,43,214,.5),0 0 40px rgba(255,43,214,.2);
  transition:.2s;font-family:inherit;
}
button.act:active{transform:scale(.97);box-shadow:0 0 30px rgba(255,43,214,.9),0 0 60px rgba(255,43,214,.4)}
button.act:disabled{background:rgba(60,40,80,.6);color:var(--muted);box-shadow:none;cursor:not-allowed}
button.act.green{background:linear-gradient(135deg,var(--green),#00b871);box-shadow:0 0 20px rgba(0,255,157,.5)}
button.act.green:active{box-shadow:0 0 30px rgba(0,255,157,.9)}

/* RESULT BOX */
.res{
  margin-top:14px;padding:14px;background:rgba(10,6,18,.7);
  border-radius:12px;font-size:14px;text-align:center;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(176,38,255,.2);transition:.3s;
}
.res.win{
  border-color:var(--green);
  background:rgba(0,255,157,.08);
  box-shadow:0 0 20px rgba(0,255,157,.4);
  color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.8);
  animation:pulseWin .6s ease;
}
.res.lose{
  border-color:var(--red);
  background:rgba(255,46,99,.08);
  box-shadow:0 0 20px rgba(255,46,99,.3);
  color:var(--red);
  animation:shake .4s ease;
}
@keyframes pulseWin{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ═══ 3D DICE ═══ */
.dice-scene{
  width:140px;height:140px;margin:20px auto;perspective:800px;
}
.dice{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform 1.6s cubic-bezier(.3,1.6,.5,1);
}
.dice-face{
  position:absolute;width:140px;height:140px;
  background:linear-gradient(135deg,#1a0e2e,#2a1050);
  border:2px solid var(--neon);
  border-radius:16px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:16px;gap:4px;
  box-shadow:inset 0 0 30px rgba(255,43,214,.4),0 0 20px rgba(255,43,214,.3);
}
.dice-face i{
  width:100%;height:100%;border-radius:50%;
  background:transparent;
}
.dice-face i.on{
  background:radial-gradient(circle,var(--neon2),var(--neon));
  box-shadow:0 0 10px var(--neon2),0 0 20px var(--neon);
}
.f1{transform:translateZ(70px)}
.f2{transform:rotateY(90deg) translateZ(70px)}
.f3{transform:rotateY(180deg) translateZ(70px)}
.f4{transform:rotateY(-90deg) translateZ(70px)}
.f5{transform:rotateX(90deg) translateZ(70px)}
.f6{transform:rotateX(-90deg) translateZ(70px)}

/* ═══ ROULETTE WHEEL ═══ */
.roulette-wrap{
  position:relative;width:260px;height:260px;margin:20px auto;
}
.wheel-pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:20px solid var(--neon2);z-index:10;filter:drop-shadow(0 0 8px var(--neon2));
}
.wheel{
  width:100%;height:100%;border-radius:50%;position:relative;
  transition:transform 4s cubic-bezier(.15,.9,.25,1);
  box-shadow:0 0 30px rgba(255,43,214,.5),inset 0 0 40px rgba(0,0,0,.5);
  background:conic-gradient(
    #ff2e63 0deg 9.73deg, #1a0e2e 9.73deg 19.46deg,
    #ff2e63 19.46deg 29.19deg, #1a0e2e 29.19deg 38.92deg,
    #ff2e63 38.92deg 48.65deg, #1a0e2e 48.65deg 58.38deg,
    #ff2e63 58.38deg 68.11deg, #1a0e2e 68.11deg 77.84deg,
    #ff2e63 77.84deg 87.57deg, #1a0e2e 87.57deg 97.3deg,
    #ff2e63 97.3deg 107.03deg, #1a0e2e 107.03deg 116.76deg,
    #ff2e63 116.76deg 126.49deg, #1a0e2e 126.49deg 136.22deg,
    #ff2e63 136.22deg 145.95deg, #1a0e2e 145.95deg 155.68deg,
    #ff2e63 155.68deg 165.41deg, #1a0e2e 165.41deg 175.14deg,
    #ff2e63 175.14deg 184.87deg, #1a0e2e 184.87deg 194.6deg,
    #ff2e63 194.6deg 204.33deg, #1a0e2e 204.33deg 214.06deg,
    #ff2e63 214.06deg 223.79deg, #1a0e2e 223.79deg 233.52deg,
    #ff2e63 233.52deg 243.25deg, #1a0e2e 243.25deg 252.98deg,
    #ff2e63 252.98deg 262.71deg, #1a0e2e 262.71deg 272.44deg,
    #ff2e63 272.44deg 282.17deg, #1a0e2e 282.17deg 291.9deg,
    #ff2e63 291.9deg 301.63deg, #1a0e2e 301.63deg 311.36deg,
    #ff2e63 311.36deg 321.09deg, #1a0e2e 321.09deg 330.82deg,
    #00ff9d 330.82deg 340.55deg, #1a0e2e 340.55deg 350.28deg,
    #ff2e63 350.28deg 360deg
  );
  border:6px solid var(--neon3);
}
.wheel::after{
  content:'';position:absolute;inset:30%;border-radius:50%;
  background:radial-gradient(circle,#1a0e2e,#0a0612);
  border:3px solid var(--neon2);
  box-shadow:0 0 20px var(--neon2),inset 0 0 20px rgba(0,240,255,.4);
}
.wheel-number{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;color:#fff;z-index:5;
  text-shadow:0 0 10px var(--neon2),0 0 20px var(--neon);
  pointer-events:none;
}

/* ═══ SLOTS ═══ */
.slots-machine{
  display:flex;justify-content:center;gap:10px;
  background:linear-gradient(180deg,rgba(26,14,46,.9),rgba(10,6,18,.9));
  border:2px solid var(--neon3);border-radius:18px;
  padding:20px 12px;margin:16px 0;position:relative;
  box-shadow:inset 0 0 30px rgba(255,43,214,.2),0 0 20px rgba(176,38,255,.4);
}
.reel{
  width:80px;height:110px;
  background:rgba(10,6,18,.9);border-radius:12px;
  position:relative;overflow:hidden;
  border:2px solid rgba(255,43,214,.4);
  box-shadow:inset 0 0 20px rgba(255,43,214,.3);
}
.reel-strip{
  position:absolute;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  transition:transform 2s cubic-bezier(.15,.9,.25,1);
}
.reel-sym{
  height:110px;width:80px;display:flex;align-items:center;justify-content:center;
  font-size:52px;flex-shrink:0;
  filter:drop-shadow(0 0 10px var(--neon));
}

/* ═══ COIN FLIP ═══ */
.coin-scene{width:120px;height:120px;margin:24px auto;perspective:600px}
.coin{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform 2s cubic-bezier(.3,1,.5,1);
}
.coin-side{
  position:absolute;inset:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:50px;font-weight:900;
  backface-visibility:hidden;
  border:4px solid var(--neon);
  box-shadow:0 0 30px var(--neon),inset 0 0 20px rgba(255,43,214,.5);
}
.coin-front{background:linear-gradient(135deg,#ffd700,#ff9500);color:#5a2a00}
.coin-back{background:linear-gradient(135deg,#c0c0c0,#708090);color:#1a1a2e;transform:rotateY(180deg)}

/* ═══ MINES ═══ */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cell{
  aspect-ratio:1;background:linear-gradient(135deg,rgba(35,18,64,.8),rgba(26,14,46,.8));
  border:2px solid rgba(176,38,255,.4);border-radius:10px;
  font-size:24px;cursor:pointer;color:#fff;
  transition:.3s;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 10px rgba(176,38,255,.2);
}
.cell:active{transform:scale(.9)}
.cell.open{
  background:linear-gradient(135deg,var(--neon2),var(--neon));
  box-shadow:0 0 15px var(--neon2),inset 0 0 10px rgba(255,255,255,.3);
  border-color:var(--neon2);
}
.cell.mine{
  background:linear-gradient(135deg,var(--red),#8b0022);
  box-shadow:0 0 15px var(--red);
  border-color:var(--red);
  animation:explode .5s ease;
}
@keyframes explode{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* HINT */
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}

/* ROW */
.row{display:flex;gap:8px}
.row>*{flex:1}

/* CONFETTI */
.confetti{
  position:fixed;top:-10px;width:10px;height:10px;pointer-events:none;z-index:9999;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* LOADING SPINNER */
.loading{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;
  margin-right:8px;vertical-align:middle;
}
</style>
</head>
<body>
<div class="wrap">

<div class="bal">
  <div><b id="bal">0</b> BC</div>
  <small id="rub"></small>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

</div>

<script> const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor('#0a0612'); tg.setBackgroundColor('#0a0612');

const H = () => ({'X-Init-Data': tg.initData, 'Content-Type': 'application/json'});
let balance = 0;

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: H(),
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

/* ═══ Плавный счётчик баланса ═══ */
let displayBal = 0;
function setBalance(v) {
  const target = parseFloat(v);
  const start = displayBal;
  const diff = target - start;
  const dur = 500;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    displayBal = start + diff * eased;
    document.getElementById('bal').textContent = displayBal.toFixed(4);
    if (p < 1) requestAnimationFrame(step);
    else { displayBal = target; document.getElementById('bal').textContent = target.toFixed(4); }
  }
  requestAnimationFrame(step);
  balance = target;
}

async function loadMe() {
  const d = await api('/api/me');
  setBalance(d.balance);
  if (d.balance_rub) document.getElementById('rub').textContent = '≈ ' + d.balance_rub + ' ₽';
  else document.getElementById('rub').textContent = '';
}

/* ═══ КОНФЕТТИ ═══ */
function confetti() {
  const colors = ['#ff2bd6','#00f0ff','#b026ff','#00ff9d','#ffd700'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
}

/* ═══ ИГРЫ ═══ */
const GAMES = [
  {id:'dice', name:'🎲 Кости'},
  {id:'coinflip', name:'🪙 Монетка'},
  {id:'roulette', name:'🎰 Рулетка'},
  {id:'slots', name:'🍒 Слоты'},
  {id:'mines', name:'💣 Мины'},
  {id:'deposit', name:'➕ Пополнить'},
  {id:'withdraw', name:'💸 Вывод'},
];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

GAMES.forEach((g, i) => {
  const t = document.createElement('button');
  t.className = 'tab' + (i === 0 ? ' on' : '');
  t.textContent = g.name;
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('p-' + g.id).classList.add('on');
  };
  tabs.appendChild(t);

  const p = document.createElement('div');
  p.className = 'panel' + (i === 0 ? ' on' : '');
  p.id = 'p-' + g.id;
  p.innerHTML = renderPanel(g.id);
  panels.appendChild(p);
});

/* ═══ РЕНДЕР ПАНЕЛЕЙ ═══ */
function renderPanel(id) {
  if (id === 'dice') return `
    <div class="card">
      <div class="dice-scene">
        <div class="dice" id="dice">
          <div class="dice-face f1">${dotsFor(1)}</div>
          <div class="dice-face f2">${dotsFor(2)}</div>
          <div class="dice-face f3">${dotsFor(3)}</div>
          <div class="dice-face f4">${dotsFor(4)}</div>
          <div class="dice-face f5">${dotsFor(5)}</div>
          <div class="dice-face f6">${dotsFor(6)}</div>
        </div>
      </div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <div class="row">
        <input type="number" id="d-target" placeholder="Цель 1-99" value="50">
        <select id="d-over"><option value="0">Меньше</option><option value="1" selected>Больше</option></select>
      </div>
      <button class="act" onclick="playDice()">🎲 Бросить</button>
      <div class="res" id="d-res">Нажми «Бросить»</div>
    </div>`;
  if (id === 'coinflip') return `
    <div class="card">
      <div class="coin-scene">
        <div class="coin" id="coin">
          <div class="coin-side coin-front">👑</div>
          <div class="coin-side coin-back">🦅</div>
        </div>
      </div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="c-side"><option value="heads">Орёл (👑)</option><option value="tails">Решка (🦅)</option></select>
      <button class="act" onclick="playCoin()">🪙 Подбросить</button>
      <div class="res" id="c-res">Нажми «Подбросить»</div>
    </div>`;
  if (id === 'roulette') return `
    <div class="card">
      <div class="roulette-wrap">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel">
          <div class="wheel-number" id="wheel-num">0</div>
        </div>
      </div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="r-type">
        <option value="red">🔴 Красное (x2)</option>
        <option value="black">⚫ Чёрное (x2)</option>
        <option value="even">Чёт (x2)</option>
        <option value="odd">Нечет (x2)</option>
        <option value="number">🎯 Число (x36)</option>
      </select>
      <input type="number" id="r-val" placeholder="Число 0-36" min="0" max="36" style="display:none">
      <button class="act" onclick="playRoulette()">🎰 Крутить</button>
      <div class="res" id="r-res">Нажми «Крутить»</div>
    </div>`;
  if (id === 'slots') return `
    <div class="card">
      <div class="slots-machine">
        <div class="reel"><div class="reel-strip" id="reel0">${stripHTML()}</div></div>
        <div class="reel"><div class="reel-strip" id="reel1">${stripHTML()}</div></div>
        <div class="reel"><div class="reel-strip" id="reel2">${stripHTML()}</div></div>
      </div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <button class="act" onclick="playSlots()">🍒 Крутить</button>
      <div class="res" id="s-res">Нажми «Крутить»</div>
    </div>`;
  if (id === 'mines') return `
    <div class="card">
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <input type="number" id="m-count" placeholder="Мин (1-24)" value="3" min="1" max="24">
      <div class="grid" id="m-grid"></div>
      <button class="act" onclick="playMines()">💣 Играть</button>
      <div class="res" id="m-res">Нажми «Играть»</div>
    </div>`;
  if (id === 'deposit') return `
    <div class="card">
      <p class="hint">Пополнение через бота <b>Bytecoin</b>. Переведи BC на наш сервис — баланс зачислится автоматически.</p>
      <button class="act green" onclick="openBytecoin()">➕ Открыть Bytecoin-бот</button>
      <div class="res" id="dep-res"></div>
    </div>`;
  if (id === 'withdraw') return `
    <div class="card">
      <input type="number" id="w-amt" placeholder="Сумма BC" step="0.0000001" min="0.0000001">
      <button class="act" onclick="doWithdraw()">💸 Вывести</button>
      <div class="res" id="w-res">Минимум 0.0000001 BC</div>
    </div>`;
  return '';
}

function dotsFor(n) {
  const dots = {
    1: [4], 2: [0,8], 3: [0,4,8], 4: [0,2,6,8], 5: [0,2,4,6,8], 6: [0,2,3,5,6,8]
  }[n] || [];
  let html = '';
  for (let i = 0; i < 9; i++) html += `<i class="${dots.includes(i) ? 'on' : ''}"></i>`;
  return html;
}

function stripHTML() {
  const syms = ['🍒','🍋','🔔','💎','7️⃣','⭐'];
  const arr = [];
  for (let i = 0; i < 20; i++) arr.push(`<div class="reel-sym">${syms[i % syms.length]}</div>`);
  return arr.join('');
}

/* ═══ ИГРЫ ═══ */
function amt() {
  const v = parseFloat(document.querySelector('.panel.on .amt')?.value);
  if (!v || v <= 0) { tg.showAlert('Введи ставку'); return null; }
  return v;
}

function isWin(r) { return r.win === true || r.win === 'True'; }

function show(id, text, win) {
  const el = document.getElementById(id);
  el.className = 'res ' + (win ? 'win' : 'lose');
  el.textContent = text;
  if (win) confetti();
}

async function play(game, extra) {
  const a = amt(); if (!a) return null;
  const d = await api('/api/bet', {game, amount: a, ...extra});
  if (d.error) { tg.showAlert(d.error); return null; }
  setBalance(d.balance);
  tg.HapticFeedback.impactOccurred('light');
  return d.result;
}

/* ─── КОСТИ ─── */
const diceRotations = {
  1: {x:0, y:0, z:0},
  2: {x:0, y:-90, z:0},
  3: {x:0, y:180, z:0},
  4: {x:0, y:90, z:0},
  5: {x:-90, y:0, z:0},
  6: {x:90, y:0, z:0}
};

async function playDice() {
  const r = await play('dice', {
    target: +document.getElementById('d-target').value,
    over: document.getElementById('d-over').value === '1'
  });
  if (!r) return;
  const roll = Math.min(6, Math.max(1, Math.ceil(r.roll / 16.67)));
  const rot = diceRotations[roll];
  const d = document.getElementById('dice');
  const spins = 3 + Math.floor(Math.random() * 2);
  d.style.transform = `rotateX(${rot.x + 360 * spins}deg) rotateY(${rot.y + 360 * spins}deg)`;
  setTimeout(() => {
    show('d-res', `🎲 ${r.roll} · ${isWin(r) ? '+' + r.payout : '−' + 'ставка'}`, isWin(r));
  }, 1700);
}

/* ─── МОНЕТКА ─── */
async function playCoin() {
  const r = await play('coinflip', {side: document.getElementById('c-side').value});
  if (!r) return;
  const c = document.getElementById('coin');
  const flips = 4 + Math.floor(Math.random() * 3);
  const final = r.result === 'heads' ? 0 : 180;
  c.style.transform = `rotateY(${final + 360 * flips}deg) rotateX(${720}deg)`;
  setTimeout(() => {
    show('c-res', r.result === 'heads' ? '👑 Орёл' : '🦅 Решка', isWin(r));
  }, 2100);
}

/* ─── РУЛЕТКА ─── */
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

async function playRoulette() {
  const t = document.getElementById('r-type').value;
  const r = await play('roulette', {bet_type: t, value: document.getElementById('r-val').value});
  if (!r) return;
  const wheel = document.getElementById('wheel');
  const num = r.number;
  const segDeg = 360 / 37;
  const targetAngle = -(num * segDeg + segDeg / 2);
  const spins = 5 + Math.floor(Math.random() * 3);
  wheel.style.transform = `rotate(${targetAngle + 360 * spins}deg)`;

  let lastN = 0;
  const iv = setInterval(() => {
    lastN = (lastN + 1) % 37;
    document.getElementById('wheel-num').textContent = lastN;
  }, 50);

  setTimeout(() => {
    clearInterval(iv);
    document.getElementById('wheel-num').textContent = num;
    const color = num === 0 ? '🟢' : (RED_NUMS.includes(num) ? '🔴' : '⚫');
    show('r-res', `${color} ${num} · ${isWin(r) ? '+' + r.payout : 'проигрыш'}`, isWin(r));
  }, 4200);
}

/* ─── СЛОТЫ ─── */
async function playSlots() {
  const r = await play('slots', {});
  if (!r) return;
  const syms = ['🍒','🍋','🔔','💎','7️⃣','⭐'];
  const reels = r.reels;

  for (let i = 0; i < 3; i++) {
    const strip = document.getElementById('reel' + i);
    const targetIdx = syms.indexOf(reels[i]);
    const stopY = -(targetIdx * 110) - (110 * 17);
    setTimeout(() => {
      strip.style.transition = 'transform 1.8s cubic-bezier(.15,.9,.25,1)';
      strip.style.transform = `translateY(${stopY}px)`;
    }, i * 400);
  }

  setTimeout(() => {
    show('s-res', `${reels.join(' ')} · ${isWin(r) ? '+' + r.payout : 'проигрыш'}`, isWin(r));
  }, 3000);
}

/* ─── МИНЫ ─── */
function buildMinesGrid() {
  const g = document.getElementById('m-grid');
  if (!g) return;
  g.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.dataset.i = i;
    g.appendChild(c);
  }
}

async function playMines() {
  const mines = +document.getElementById('m-count').value;
  const picked = [0, 1, 2];
  const r = await play('mines', {mines, picked});
  if (!r) return;

  const cells = document.querySelectorAll('#m-grid .cell');
  picked.forEach(i => cells[i]?.classList.add('open'));

  const mineSet = new Set(r.mine_cells.map(x => parseInt(x)));
  mineSet.forEach(i => {
    if (cells[i]) {
      cells[i].classList.add('mine');
      cells[i].textContent = '💥';
    }
  });

  setTimeout(() => {
    show('m-res', `x${r.multiplier} · ${isWin(r) ? '+' + r.payout : 'мина!'}`, isWin(r));
  }, 800);
}

/* ─── ВЫВОД ─── */
async function doWithdraw() {
  const v = parseFloat(document.getElementById('w-amt').value);
  if (!v || v <= 0) { tg.showAlert('Введи сумму'); return; }
  const d = await api('/api/withdraw', {amount: v});
  if (d.error) show('w-res', '⚠️ ' + (d.message || d.error), false);
  else { show('w-res', '✅ TX: ' + d.transaction_id.slice(0, 8) + '…', true); loadMe(); }
}

document.addEventListener('change', e => {

setInterval(async () => {

}, 5000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadMe();
});
window.addEventListener('focus', () => loadMe());

loadMe();
