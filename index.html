<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Byte Casino</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --pink:#ff29c8;--pink-2:#ff70e4;--purple:#6d24f5;--blue:#20c9ff;
  --yellow:#ffe66d;--green:#54ff91;--bg:#140725;--panel:rgba(36,10,69,.78);
  --neon:#ff2bd6;--neon2:#00f0ff;--neon3:#b026ff;--red:#ff2e63;
  --text:#e8d9ff;--muted:#8b7ba8;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 50% 0%,#601c94 0%,transparent 33%),radial-gradient(circle at 0% 100%,#102b75 0%,transparent 38%),linear-gradient(145deg,#17072d,#080311 75%);
  color:#fff;padding:12px;padding-bottom:90px;min-height:100vh;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent);z-index:0}
.wrap{position:relative;z-index:1}

.bal{background:linear-gradient(135deg,rgba(255,43,214,.15),rgba(0,240,255,.08));border:1px solid rgba(255,43,214,.4);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 20px rgba(255,43,214,.3);position:relative;overflow:hidden}
.bal::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,43,214,.1),transparent 30%);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bal>div{position:relative;z-index:1}
.bal b{font-size:26px;color:var(--neon);text-shadow:0 0 10px rgba(255,43,214,.8),0 0 20px rgba(255,43,214,.4);font-family:'Courier New',monospace}
.bal small{color:var(--neon2);font-size:12px;display:block;margin-top:2px;text-shadow:0 0 6px rgba(0,240,255,.6)}

.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:rgba(35,18,64,.6);border:1px solid rgba(176,38,255,.3);color:var(--muted);padding:9px 16px;border-radius:10px;font-size:13px;white-space:nowrap;cursor:pointer;transition:.25s;font-weight:600;backdrop-filter:blur(10px)}
.tab.on{background:linear-gradient(135deg,rgba(255,43,214,.4),rgba(176,38,255,.3));color:#fff;border-color:var(--neon);box-shadow:0 0 12px rgba(255,43,214,.6);text-shadow:0 0 8px rgba(255,43,214,.8)}
.tab:active{transform:scale(.95)}

.panel{display:none;animation:fadeIn .3s ease}
.panel.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(135deg,rgba(26,14,46,.9),rgba(35,18,64,.8));border:1px solid rgba(176,38,255,.3);border-radius:18px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(176,38,255,.15),inset 0 1px 0 rgba(255,255,255,.05)}

input,select{width:100%;padding:14px;background:rgba(10,6,18,.8);border:1px solid rgba(176,38,255,.4);color:#fff;border-radius:12px;font-size:16px;margin-bottom:12px;font-family:inherit;transition:.25s;outline:none}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,43,214,.2),0 0 15px rgba(255,43,214,.4)}
input::placeholder{color:var(--muted)}

button.act{width:100%;padding:16px;background:linear-gradient(135deg,var(--neon),var(--neon3));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;text-transform:uppercase;letter-spacing:1px;box-shadow:0 0 20px rgba(255,43,214,.5),0 0 40px rgba(255,43,214,.2);transition:.2s;font-family:inherit}
button.act:active{transform:scale(.97)}
button.act:disabled{background:rgba(60,40,80,.6);color:var(--muted);box-shadow:none;cursor:not-allowed}
button.act.green{background:linear-gradient(135deg,var(--green),#00b871);box-shadow:0 0 20px rgba(0,255,157,.5)}

.res{margin-top:14px;padding:14px;background:rgba(10,6,18,.7);border-radius:12px;font-size:14px;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(176,38,255,.2);transition:.3s}
.res.win{border-color:var(--green);background:rgba(0,255,157,.08);color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.8)}
.res.lose{border-color:var(--red);background:rgba(255,46,99,.08);color:var(--red);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.dice-scene{width:140px;height:140px;margin:20px auto;perspective:800px}
.dice{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.3,1.6,.5,1)}
.dice-face{position:absolute;width:140px;height:140px;background:linear-gradient(135deg,#1a0e2e,#2a1050);border:2px solid var(--neon);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:4px;box-shadow:inset 0 0 30px rgba(255,43,214,.4),0 0 20px rgba(255,43,214,.3)}
.dice-face i{width:100%;height:100%;border-radius:50%;background:transparent}
.dice-face i.on{background:radial-gradient(circle,var(--neon2),var(--neon));box-shadow:0 0 10px var(--neon2)}
.f1{transform:translateZ(70px)}
.f2{transform:rotateY(90deg) translateZ(70px)}
.f3{transform:rotateY(180deg) translateZ(70px)}
.f4{transform:rotateY(-90deg) translateZ(70px)}
.f5{transform:rotateX(90deg) translateZ(70px)}
.f6{transform:rotateX(-90deg) translateZ(70px)}

.coin-scene{width:120px;height:120px;margin:24px auto;perspective:600px}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 2s cubic-bezier(.3,1,.5,1)}
.coin-side{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:900;backface-visibility:hidden;border:4px solid var(--neon);box-shadow:0 0 30px var(--neon)}
.coin-front{background:linear-gradient(135deg,#ffd700,#ff9500);color:#5a2a00}
.coin-back{background:linear-gradient(135deg,#c0c0c0,#708090);color:#1a1a2e;transform:rotateY(180deg)}

.roulette-wrap{position:relative;width:260px;height:260px;margin:20px auto}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--neon2);z-index:10;filter:drop-shadow(0 0 8px var(--neon2))}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;transition:transform 4s cubic-bezier(.15,.9,.25,1);box-shadow:0 0 30px rgba(255,43,214,.5),inset 0 0 40px rgba(0,0,0,.5);background:repeating-conic-gradient(#ff2e63 0deg 9.73deg,#1a0e2e 9.73deg 19.46deg);border:6px solid var(--neon3)}
.wheel::after{content:'';position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,#1a0e2e,#0a0612);border:3px solid var(--neon2);box-shadow:0 0 20px var(--neon2)}
.wheel-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff;z-index:5;text-shadow:0 0 10px var(--neon2),0 0 20px var(--neon);pointer-events:none}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cell{aspect-ratio:1;background:linear-gradient(135deg,rgba(35,18,64,.8),rgba(26,14,46,.8));border:2px solid rgba(176,38,255,.4);border-radius:10px;font-size:24px;cursor:pointer;color:#fff;transition:.3s;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 10px rgba(176,38,255,.2)}
.cell:active{transform:scale(.9)}
.cell:disabled{opacity:.7;cursor:default}
.cell.open{background:linear-gradient(135deg,var(--neon2),var(--neon));box-shadow:0 0 15px var(--neon2);border-color:var(--neon2)}
.cell.mine{background:linear-gradient(135deg,var(--red),#8b0022);box-shadow:0 0 15px var(--red);border-color:var(--red);animation:explode .5s ease}
@keyframes explode{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.mult-display{text-align:center;margin-bottom:14px;font-size:15px;color:var(--neon2);text-shadow:0 0 8px var(--neon2);font-weight:600}
.mult-display b{color:var(--green);text-shadow:0 0 8px var(--green)}

.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.confetti{position:fixed;top:-10px;width:10px;height:10px;pointer-events:none;z-index:9999;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ═══ SUGAR RUSH (Gemini) ═══ */
.sugar-wrap{padding:clamp(8px,2vw,14px);border:2px solid #b93aff;border-radius:20px;background:linear-gradient(145deg,rgba(83,14,131,.9),rgba(17,8,52,.95));box-shadow:0 0 0 4px rgba(255,31,214,.08),0 0 30px rgba(207,0,255,.45),inset 0 0 35px rgba(255,45,208,.2);margin-bottom:14px}
.sugar-board{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(3px,.7vw,7px);padding:clamp(4px,.9vw,9px);border-radius:14px;background:rgba(5,1,20,.58);box-shadow:inset 0 0 25px #090014}
.sugar-cell{aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.42),transparent 17%),linear-gradient(145deg,#7d25d8,#321078 70%);box-shadow:inset 0 -8px 13px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);transition:.18s ease}
.sugar-cell::after{content:"";position:absolute;inset:2px;border-radius:12px;border:1px solid rgba(255,255,255,.16);pointer-events:none}
.sugar-cell .symbol{z-index:1;font-size:clamp(20px,5vw,44px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4));user-select:none}
.sugar-cell.empty{opacity:.15;transform:scale(.75)}
.sugar-cell.highlight{z-index:3;transform:scale(1.08);border-color:#fff;box-shadow:0 0 0 3px var(--yellow),0 0 18px var(--yellow),0 0 38px var(--pink);animation:sugarPulse .42s infinite alternate}
.sugar-cell.pop{animation:sugarPop .48s forwards}
.sugar-cell.fall{animation:sugarFall .42s ease-out}
@keyframes sugarPulse{to{filter:brightness(1.55)}}
@keyframes sugarPop{0%{transform:scale(1.08);opacity:1}55%{transform:scale(1.35) rotate(8deg);opacity:.9}100%{transform:scale(0);opacity:0}}
@keyframes sugarFall{from{transform:translateY(-22px);opacity:0}to{transform:translateY(0);opacity:1}}
.sugar-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:10px;color:#bca5d4;font-size:11px}
.sugar-legend b{padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.08)}
.sugar-stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:13px;color:#cdbbe2;flex-wrap:wrap}
.sugar-stats span{background:rgba(255,255,255,.06);padding:6px 10px;border-radius:8px}
.sugar-stats b{color:var(--yellow)}
.sugar-mult{margin:10px 0;padding:10px;border-radius:12px;text-align:center;font-size:28px;font-weight:900;color:var(--yellow);background:linear-gradient(135deg,#7d18c9,#32127e);border:1px solid #e65eea;text-shadow:0 0 12px #ff6e00;box-shadow:0 0 22px rgba(255,37,224,.3)}
.sugar-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sugar-btns button{padding:14px;border:0;border-radius:12px;color:#fff;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-size:13px;font-family:inherit}
.sugar-spin{background:linear-gradient(135deg,#ff25c9,#8c22f5);box-shadow:0 4px 0 #55129b,0 0 22px rgba(255,24,206,.42)}
.sugar-buy{background:linear-gradient(135deg,#ff9b21,#ff28a8);box-shadow:0 4px 0 #a52a50,0 0 22px rgba(255,137,19,.45)}
.sugar-btns button:active{transform:translateY(3px);box-shadow:none}
.sugar-btns button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <div class="bal">
    <div><b id="bal">0</b> BC</div>
    <small id="rub"></small>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script> const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor('#0a0612'); tg.setBackgroundColor('#0a0612');

const H = () => ({'X-Init-Data': tg.initData, 'Content-Type': 'application/json'});
let balance = 0;

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: H(),
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

let displayBal = 0;
function setBalance(v) {
  const target = parseFloat(v);
  const start = displayBal;
  const diff = target - start;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min((t - t0) / 500, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    displayBal = start + diff * eased;
    document.getElementById('bal').textContent = displayBal.toFixed(4);
    if (p < 1) requestAnimationFrame(step);
    else { displayBal = target; document.getElementById('bal').textContent = target.toFixed(4); }
  }
  requestAnimationFrame(step);
  balance = target;
}

async function loadMe() {
  try {
    const d = await api('/api/me');
    setBalance(d.balance);
    const rub = document.getElementById('rub');
    if (d.balance_rub) rub.textContent = '≈ ' + d.balance_rub + ' ₽';
    else rub.textContent = '';
  } catch (e) {}
}

function confetti() {
  const colors = ['#ff2bd6','#00f0ff','#b026ff','#00ff9d','#ffd700'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
}

const GAMES = [
  {id:'dice', name:'🎲 Кости'},
  {id:'coinflip', name:'🪙 Монетка'},
  {id:'roulette', name:'🎰 Рулетка'},
  {id:'slots', name:'🍭 Sugar Rush'},
  {id:'mines', name:'💣 Мины'},
  {id:'deposit', name:'➕ Пополнить'},
  {id:'withdraw', name:'💸 Вывод'},
];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

GAMES.forEach((g, i) => {
  const t = document.createElement('button');
  t.className = 'tab' + (i === 0 ? ' on' : '');
  t.textContent = g.name;
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('p-' + g.id).classList.add('on');
    if (g.id === 'mines') buildMinesGrid();
  };
  tabs.appendChild(t);

  const p = document.createElement('div');
  p.className = 'panel' + (i === 0 ? ' on' : '');
  p.id = 'p-' + g.id;
  p.innerHTML = renderPanel(g.id);
  panels.appendChild(p);
});

function dotsFor(n) {
  const dots = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[];
  let h = '';
  for (let i = 0; i < 9; i++) h += `<i class="${dots.includes(i)?'on':''}"></i>`;
  return h;
}

function renderPanel(id) {
  if (id === 'dice') return `
    <div class="card">
      <div class="dice-scene"><div class="dice" id="dice">
        <div class="dice-face f1">${dotsFor(1)}</div>
        <div class="dice-face f2">${dotsFor(2)}</div>
        <div class="dice-face f3">${dotsFor(3)}</div>
        <div class="dice-face f4">${dotsFor(4)}</div>
        <div class="dice-face f5">${dotsFor(5)}</div>
        <div class="dice-face f6">${dotsFor(6)}</div>
      </div></div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <div class="row">
        <input type="number" id="d-target" placeholder="Цель 1-99" value="50">
        <select id="d-over"><option value="0">Меньше</option><option value="1" selected>Больше</option></select>
      </div>
      <button class="act" onclick="playDice()">🎲 Бросить</button>
      <div class="res" id="d-res">Нажми «Бросить»</div>
    </div>`;
  if (id === 'coinflip') return `
    <div class="card">
      <div class="coin-scene"><div class="coin" id="coin">
        <div class="coin-side coin-front">👑</div>
        <div class="coin-side coin-back">🦅</div>
      </div></div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="c-side"><option value="heads">Орёл (👑)</option><option value="tails">Решка (🦅)</option></select>
      <button class="act" onclick="playCoin()">🪙 Подбросить</button>
      <div class="res" id="c-res">Нажми «Подбросить»</div>
    </div>`;
  if (id === 'roulette') return `
    <div class="card">
      <div class="roulette-wrap">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel"><div class="wheel-number" id="wheel-num">0</div></div>
      </div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="r-type">
        <option value="red">🔴 Красное (x2)</option>
        <option value="black">⚫ Чёрное (x2)</option>
        <option value="even">Чёт (x2)</option>
        <option value="odd">Нечет (x2)</option>
        <option value="number">🎯 Число (x36)</option>
      </select>
      <input type="number" id="r-val" placeholder="Число 0-36" min="0" max="36" style="display:none">
      <button class="act" onclick="playRoulette()">🎰 Крутить</button>
      <div class="res" id="r-res">Нажми «Крутить»</div>
    </div>`;
  if (id === 'slots') return `
    <div class="card">
      <div class="sugar-stats">
        <span>Каскад: <b id="s-casc">—</b></span>
        <span>Кластеры: <b id="s-clust">—</b></span>
        <span>Фриспины: <b id="s-fs">0</b></span>
      </div>
      <div class="sugar-wrap">
        <div id="sugar-board" class="sugar-board"></div>
      </div>
      <div class="sugar-mult" id="s-mult">x1</div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001" id="s-bet">
      <div class="sugar-btns">
        <button class="sugar-spin" id="s-spin" onclick="playSugar()">🍭 КРУТИТЬ</button>
        <button class="sugar-buy" id="s-buy" onclick="buySugarBonus()">⭐ БОНУС 100x</button>
      </div>
      <div class="res" id="s-res">Крути и собирай кластеры 5+</div>
    </div>`;
  if (id === 'mines') return `
    <div class="card">
      <div id="m-setup">
        <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
        <input type="number" id="m-count" placeholder="Мин (1-24)" value="3" min="1" max="24">
        <button class="act" onclick="minesStart()">💣 Начать игру</button>
      </div>
      <div id="m-play" style="display:none">
        <div class="mult-display">Множитель: <b id="m-mult">x1.00</b> · Выигрыш: <b id="m-pot">0</b> BC</div>
        <div class="grid" id="m-grid"></div>
        <button class="act green" onclick="minesCashout()">💰 Забрать</button>
      </div>
      <div class="res" id="m-res"></div>
    </div>`;
  if (id === 'deposit') return `
    <div class="card">
      <p class="hint">Пополнение через бота <b>Bytecoin</b>. Переведи BC на наш сервис — баланс зачислится автоматически.</p>
      <button class="act green" onclick="openBytecoin()">➕ Открыть Bytecoin-бот</button>
      <div class="res" id="dep-res"></div>
    </div>`;
  if (id === 'withdraw') return `
    <div class="card">
      <input type="number" id="w-amt" placeholder="Сумма BC" step="0.0000001" min="0.0000001">
      <button class="act" onclick="doWithdraw()">💸 Вывести</button>
      <div class="res" id="w-res">Минимум 0.0000001 BC</div>
    </div>`;
  return '';
}

function amt() {
  const el = document.querySelector('.panel.on .amt');
  if (!el) return null;
  const v = parseFloat(el.value);
  if (!v || v <= 0) { tg.showAlert('Введи ставку'); return null; }
  return v;
}

function isWin(r) { return r.win === true || r.win === 'True'; }

function show(id, text, win) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'res ' + (win ? 'win' : 'lose');
  el.textContent = text;
  if (win) confetti();
}

let betInFlight = false;
async function play(game, extra) {
  if (betInFlight) return null;
  const a = amt(); if (!a) return null;
  betInFlight = true;
  document.querySelectorAll('button.act').forEach(b => b.disabled = true);
  try {
    const d = await api('/api/bet', {game, amount: a, ...extra});
    if (d.error) { tg.showAlert(d.error); return null; }
    setBalance(d.balance);
    tg.HapticFeedback.impactOccurred('light');
    return d.result;
  } finally {
    betInFlight = false;
    document.querySelectorAll('button.act').forEach(b => b.disabled = false);
  }
}

/* КОСТИ */
const diceRot = {1:{x:0,y:0},2:{x:0,y:-90},3:{x:0,y:180},4:{x:0,y:90},5:{x:-90,y:0},6:{x:90,y:0}};
async function playDice() {
  const r = await play('dice', {
    target: +document.getElementById('d-target').value,
    over: document.getElementById('d-over').value === '1'
  });
  if (!r) return;
  const roll = Math.min(6, Math.max(1, Math.ceil(parseInt(r.roll) / 16.67)));
  const rot = diceRot[roll];
  const d = document.getElementById('dice');
  const spins = 3 + Math.floor(Math.random() * 2);
  d.style.transform = `rotateX(${rot.x + 360*spins}deg) rotateY(${rot.y + 360*spins}deg)`;
  setTimeout(() => {
    show('d-res', `🎲 ${r.roll} · ${isWin(r) ? '+' + r.payout : 'проигрыш'}`, isWin(r));
  }, 1700);
}

  const flips = 4 + Math.floor(Math.random() * 3);
  const final = r.result === 'heads' ? 0 : 180;
  c.style.transform = `rotateY(${final + 360*flips}deg) rotateX(720deg)`;

/* РУЛЕТКА */
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
async function playRoulette() {
  const t = document.getElementById('r-type').value;
  const r = await play('roulette', {bet_type: t, value: document.getElementById('r-val').value});
  if (!r) return;
  const wheel = document.getElementById('wheel');
  const num = parseInt(r.number);
  const segDeg = 360 / 37;
  const target = -(num * segDeg + segDeg/2);
  const spins = 5 + Math.floor(Math.random() * 3);
  wheel.style.transform = `rotate(${target + 360*spins}deg)`;
  let n = 0;
  const iv = setInterval(() => { n = (n + 1) % 37; document.getElementById('wheel-num').textContent = n; }, 50);
  setTimeout(() => {
    clearInterval(iv);
    document.getElementById('wheel-num').textContent = num;
    const color = num === 0 ? '🟢' : (RED_NUMS.includes(num) ? '🔴' : '⚫');
    show('r-res', `${color} ${num} · ${isWin(r) ? '+' + r.payout : 'проигрыш'}`, isWin(r));
  }, 4200);
}

/* ═══ SUGAR RUSH ═══ */
const SUGAR_ICONS = {red:"🍓",blue:"💎",green:"🍏",yellow:"🍋",purple:"🍇",orange:"🍊",scatter:"⭐"};

function drawSugarBoard(grid, animation) {
  const board = document.getElementById('sugar-board');
  board.innerHTML = '';
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = document.createElement('div');
      cell.className = 'sugar-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      const sym = grid[r][c];
      const icon = document.createElement('span');
      icon.className = 'symbol';
      icon.textContent = SUGAR_ICONS[sym] || '🍭';
      cell.appendChild(icon);
      board.appendChild(cell);
      if (animation) {
        cell.classList.add('fall');
        cell.style.animationDelay = (r + c) * 12 + 'ms';
      }
    }
  }
}

function sugarGetCell(r, c) {
  return document.querySelector(`.sugar-cell[data-row="${r}"][data-col="${c}"]`);
}

function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

async function playSugarAnimation(sugarResult) {
  const spinBtn = document.getElementById('s-spin');
  const buyBtn = document.getElementById('s-buy');
  spinBtn.disabled = true;
  buyBtn.disabled = true;

  const cascades = sugarResult.cascades || [];
  const total = cascades.length;

  for (let i = 0; i < cascades.length; i++) {
    const c = cascades[i];
    drawSugarBoard(c.grid, true);
    document.getElementById('s-casc').textContent = `${i+1} / ${total}`;
    document.getElementById('s-clust').textContent = (c.clusters || []).length;
    document.getElementById('s-fs').textContent = sugarResult.freeSpins || 0;
    document.getElementById('s-mult').textContent = 'x' + (c.multiplier || 1);
    await sleep(460);

    for (const cl of (c.clusters || [])) {
      if (!cl.cells || cl.cells.length < 5) continue;
      // Подсветка
      document.querySelectorAll('.sugar-cell').forEach(x => x.classList.remove('highlight','pop'));
      cl.cells.forEach(([r, col]) => {
        const cell = sugarGetCell(r, col);
        if (cell) cell.classList.add('highlight');
      });
      await sleep(650);

      // Взрыв
      cl.cells.forEach(([r, col]) => {
        const cell = sugarGetCell(r, col);
        if (cell) { cell.classList.remove('highlight'); cell.classList.add('pop'); }
      });
      await sleep(490);
    }
    document.querySelectorAll('.sugar-cell').forEach(x => x.classList.remove('highlight','pop'));
    if (i < cascades.length - 1) await sleep(240);
  }

  const win = parseFloat(sugarResult.totalWin || 0);
  if (win > 0) {
    show('s-res', `+${win.toFixed(4)} BC (${total} каскадов)`, true);
  } else {
    show('s-res', 'Проигрыш', false);
  }

  spinBtn.disabled = false;
  buyBtn.disabled = false;
  loadMe();
}

  if (!a || a <= 0) { tg.showAlert('Введи ставку'); return; }

/* МИНЫ */
let minesGameId = null;
let minesActive = false;

function buildMinesGrid() {
  const g = document.getElementById('m-grid');
  if (!g) return;
  g.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.dataset.i = i;
    c.onclick = () => minesOpen(i, c);
    g.appendChild(c);
  }
}

async function minesStart() {
  if (minesActive) return;
  const a = amt(); if (!a) return;
  const mines = parseInt(document.getElementById('m-count').value);
  if (mines < 1 || mines > 24) { tg.showAlert('Мины: 1-24'); return; }

  const d = await api('/api/bet', {game: 'mines', amount: a, mines});
  if (d.error) { tg.showAlert(d.error); return; }

  minesGameId = d.game_id;
  minesActive = true;
  setBalance(d.balance);
  document.getElementById('m-setup').style.display = 'none';
  document.getElementById('m-play').style.display = 'block';
  document.getElementById('m-mult').textContent = 'x1.00';
  document.getElementById('m-pot').textContent = '0';
  document.getElementById('m-res').textContent = 'Открывай клетки — не попади на мину';
  document.getElementById('m-res').className = 'res';
  buildMinesGrid();
}

async function minesOpen(cellIdx, el) {
  if (!minesActive || el.classList.contains('open') || el.classList.contains('mine')) return;
  el.disabled = true;
  const d = await api('/api/mines/open', {game_id: minesGameId, cell: cellIdx});
  el.disabled = false;
  if (d.error) { tg.showAlert(d.error); return; }
  tg.HapticFeedback.impactOccurred('light');

  (d.opened || []).forEach(i => {
    const c = document.querySelector(`#m-grid .cell[data-i="${i}"]`);
    if (c) { c.classList.add('open'); c.textContent = '💎'; }
  });

  if (d.result === 'mine') {
    minesActive = false;
    (d.mine_cells || []).forEach(i => {
      const c = document.querySelector(`#m-grid .cell[data-i="${i}"]`);
      if (c) { c.classList.add('mine'); c.textContent = '💥'; }
    });
    el.classList.add('mine'); el.textContent = '💥';
    setBalance(d.balance);
    show('m-res', '💥 Мина! Проигрыш', false);
    setTimeout(() => {
      document.getElementById('m-setup').style.display = 'block';
      document.getElementById('m-play').style.display = 'none';
    }, 2500);
    return;
  }

  if (d.result === 'win_all') {
    minesActive = false;
    setBalance(d.balance);
    (d.mine_cells || []).forEach(i => {
      const c = document.querySelector(`#m-grid .cell[data-i="${i}"]`);
      if (c && !c.classList.contains('open')) c.textContent = '💣';
    });
    show('m-res', `🎉 Все клетки! +${d.payout}`, true);
    setTimeout(() => {
      document.getElementById('m-setup').style.display = 'block';
      document.getElementById('m-play').style.display = 'none';
    }, 2500);
    return;
  }

  setBalance(d.balance);
  document.getElementById('m-mult').textContent = 'x' + d.multiplier;
  document.getElementById('m-pot').textContent = d.payout;
  confetti();
}

async function minesCashout() {
  if (!minesActive) return;
  const d = await api('/api/mines/cashout', {game_id: minesGameId});
  if (d.error) { tg.showAlert(d.error); return; }
  minesActive = false;
  setBalance(d.balance);
  show('m-res', `💰 Забрал +${d.payout} (x${d.multiplier})`, true);
  tg.HapticFeedback.notificationOccurred('success');
  setTimeout(() => {
    document.getElementById('m-setup').style.display = 'block';
    document.getElementById('m-play').style.display = 'none';
  }, 2500);
}
