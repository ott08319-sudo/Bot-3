<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Casino</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0e1116;color:#fff;padding:12px;padding-bottom:80px}
.bal{background:#1a1f27;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.bal b{font-size:22px;color:#4ade80}
.bal small{color:#8b95a5;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{background:#1a1f27;border:none;color:#8b95a5;padding:8px 14px;border-radius:8px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:#2563eb;color:#fff}
.panel{display:none}.panel.on{display:block}
.card{background:#1a1f27;border-radius:12px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;background:#0e1116;border:1px solid #2a3038;color:#fff;border-radius:8px;font-size:16px;margin-bottom:10px}
button.act{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button.act:active{background:#1d4ed8}
button.act:disabled{background:#374151;color:#6b7280}
.res{margin-top:12px;padding:12px;background:#0e1116;border-radius:8px;font-size:14px;text-align:center;min-height:20px}
.res.win{border-left:3px solid #4ade80}
.res.lose{border-left:3px solid #ef4444}
.reels{display:flex;justify-content:center;gap:8px;font-size:48px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.cell{aspect-ratio:1;background:#2a3038;border:none;border-radius:8px;font-size:24px;cursor:pointer;color:#fff}
.cell.open{background:#1e40af}
.cell.mine{background:#991b1b}
.row{display:flex;gap:8px}
.row>*{flex:1}
</style>
</head>
<body>

<div class="bal">
  <div><b id="bal">0</b> BC</div>
  <small id="rub"></small>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor('#0e1116'); tg.setBackgroundColor('#0e1116');

const H = () => ({'X-Init-Data': tg.initData, 'Content-Type': 'application/json'});

let balance = 0;

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: H(),
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

function setBalance(v) {
  balance = parseFloat(v);
  document.getElementById('bal').textContent = balance.toFixed(4);
  document.querySelectorAll('.act').forEach(b => {
    const amt = parseFloat(document.querySelector('.amt')?.value || 0);
    b.disabled = amt > balance;
  });
}

async function loadMe() {
  const d = await api('/api/me');
  setBalance(d.balance);
  if (d.balance_rub) document.getElementById('rub').textContent = '≈ ' + d.balance_rub + ' ₽';
}

// ── Игры ──
const GAMES = [
  {id:'dice', name:'🎲 Кости'},
  {id:'coinflip', name:'🪙 Монетка'},
  {id:'roulette', name:'🎰 Рулетка'},
  {id:'slots', name:'🍒 Слоты'},
  {id:'mines', name:'💣 Мины'},
  {id:'withdraw', name:'💸 Вывод'},
];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

GAMES.forEach((g, i) => {
  const t = document.createElement('button');
  t.className = 'tab' + (i === 0 ? ' on' : '');
  t.textContent = g.name;
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('p-' + g.id).classList.add('on');
  };
  tabs.appendChild(t);

  const p = document.createElement('div');
  p.className = 'panel' + (i === 0 ? ' on' : '');
  p.id = 'p-' + g.id;
  p.innerHTML = renderPanel(g.id);
  panels.appendChild(p);
});

function renderPanel(id) {
  if (id === 'dice') return `
    <div class="card">
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <div class="row">
        <input type="number" id="d-target" placeholder="Цель (1-99)" value="50">
        <select id="d-over"><option value="0">Меньше</option><option value="1" selected>Больше</option></select>
      </div>
      <button class="act" onclick="playDice()">Играть</button>
      <div class="res" id="d-res"></div>
    </div>`;
  if (id === 'coinflip') return `
    <div class="card">
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="c-side"><option value="heads">Орёл</option><option value="tails">Решка</option></select>
      <button class="act" onclick="playCoin()">Играть</button>
      <div class="res" id="c-res"></div>
    </div>`;
  if (id === 'roulette') return `
    <div class="card">
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <select id="r-type">
        <option value="red">Красное (x2)</option>
        <option value="black">Чёрное (x2)</option>
        <option value="even">Чёт (x2)</option>
        <option value="odd">Нечет (x2)</option>
        <option value="number">Число (x36)</option>
      </select>
      <input type="number" id="r-val" placeholder="Число 0-36" min="0" max="36" style="display:none">
      <button class="act" onclick="playRoulette()">Играть</button>
      <div class="res" id="r-res"></div>
    </div>`;
  if (id === 'slots') return `
    <div class="card">
      <div class="reels" id="s-reels">❓ ❓ ❓</div>
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <button class="act" onclick="playSlots()">Крутить</button>
      <div class="res" id="s-res"></div>
    </div>`;
  if (id === 'mines') return `
    <div class="card">
      <input class="amt" type="number" placeholder="Ставка BC" step="0.0001" min="0.0001">
      <input type="number" id="m-count" placeholder="Мин (1-24)" value="3" min="1" max="24">
      <div class="grid" id="m-grid"></div>
      <button class="act" onclick="playMines()">Играть</button>
      <div class="res" id="m-res"></div>
    </div>`;
  if (id === 'withdraw') return `
    <div class="card">
      <input type="number" id="w-amt" placeholder="Сумма BC" step="0.0000001" min="0.0000001">
      <button class="act" onclick="doWithdraw()">Вывести в Bytecoin</button>
      <div class="res" id="w-res"></div>
      <small style="color:#8b95a5;display:block;margin-top:8px">Минимум 0.0000001 BC. Приходит на ваш Bytecoin-баланс.</small>
    </div>`;
  return '';
}

// показать поле для числа в рулетке
document.addEventListener('change', e => {
  if (e.target.id === 'r-type') {
    document.getElementById('r-val').style.display = e.target.value === 'number' ? 'block' : 'none';
  }
});

// ── Хелперы ──
function amt() {
  const v = parseFloat(document.querySelector('.panel.on .amt').value);
  if (!v || v <= 0) { tg.showAlert('Введите ставку'); return null; }
  return v;
}

function show(id, data, win) {
  const el = document.getElementById(id);
  el.className = 'res ' + (win ? 'win' : 'lose');
  el.textContent = data;
}

async function play(game, extra, resId) {
  const a = amt(); if (!a) return;
  const d = await api('/api/bet', {game, amount: a, ...extra});
  if (d.error) { tg.showAlert(d.error); return; }
  setBalance(d.balance);
  tg.HapticFeedback.impactOccurred('light');
  return d.result;
}

// ── Игры ──
async function playDice() {
  const r = await play('dice', {
    target: +document.getElementById('d-target').value,
    over: document.getElementById('d-over').value === '1'
  });
  if (r) show('d-res', `Выпало ${r.roll} · ${r.win ? '+' + r.payout : 'проигрыш'}`, r.win === 'True' || r.win === true);
}
async function playCoin() {
  const r = await play('coinflip', {side: document.getElementById('c-side').value});
  if (r) show('c-res', `${r.result === 'heads' ? 'Орёл' : 'Решка'} · ${r.win === 'True' || r.win === true ? '+' + r.payout : 'проигрыш'}`, r.win === 'True' || r.win === true);
}
async function playRoulette() {
  const t = document.getElementById('r-type').value;
  const r = await play('roulette', {bet_type: t, value: document.getElementById('r-val').value});
  if (r) show('r-res', `Число ${r.number} · ${r.win === 'True' || r.win === true ? '+' + r.payout : 'проигрыш'}`, r.win === 'True' || r.win === true);
}
async function playSlots() {
  const r = await play('slots', {});
  if (r) {
    document.getElementById('s-reels').textContent = r.reels.join(' ');
    show('s-res', r.win === 'True' || r.win === true ? '+' + r.payout : 'проигрыш', r.win === 'True' || r.win === true);
  }
}
async function playMines() {
  const mines = +document.getElementById('m-count').value;
  const picked = [...Array(25).keys()].slice(0, 3);
  const r = await play('mines', {mines, picked});
  if (r) show('m-res', `Множитель x${r.multiplier} · ${r.win === 'True' || r.win === true ? '+' + r.payout : 'мина!'}`, r.win === 'True' || r.win === true);
}
async function doWithdraw() {
  const v = parseFloat(document.getElementById('w-amt').value);
  if (!v || v <= 0) { tg.showAlert('Введите сумму'); return; }
  const d = await api('/api/withdraw', {amount: v});
  if (d.error) show('w-res', 'Ошибка: ' + (d.message || d.error), false);
  else { show('w-res', '✅ Выведено. TX: ' + d.transaction_id.slice(0, 8) + '…', true); loadMe(); }
}

loadMe();
</script>
</body>
</html>
